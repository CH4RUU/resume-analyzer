spring.application.name=resume-analyzer

# --- MySQL ---
# Every value below can be overridden by an environment variable of the same name
# (Spring's relaxed binding), so a production host just sets SPRING_DATASOURCE_URL etc.
# without touching this file. Defaults here are for local development.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/resume_analyzer?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Uploads ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Optional AI feedback (Google Gemini API) ---
# Set the GEMINI_API_KEY environment variable to enable POST /api/analyses/{id}/ai-feedback.
# Leave it unset and the rule-based analyzer keeps working; the AI endpoint just returns 503.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-2.0-flash
gemini.base-url=https://generativelanguage.googleapis.com

server.port=${PORT:8080}
